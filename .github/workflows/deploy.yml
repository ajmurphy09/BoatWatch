name: Update Green Bay Ship Watch

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch and process live CESARops AIS
        env:
          SITE_LATITUDE: ${{ secrets.SITE_LATITUDE }}
          SITE_LONGITUDE: ${{ secrets.SITE_LONGITUDE }}
          SITE_NAME: "M-35 Family Watch Area"
        run: python scripts/update_cloud_snapshot.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
